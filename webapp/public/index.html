<!DOCTYPE html>
<html lang="en">
    <head>
        <title>RMS Dashboard</title>
        <link rel="stylesheet" href="/stylesheets/style.css">
    </head>
    <body>
        <div id="login_container">
            <h1>Login</h1>
            <p>
                <label for="client_id">Client ID: </label>
                <input type="text" id="client_id" name="client_id" placeholder="Client ID" value="test"/>
            </p>
            <p>
                <label for="username">Username: </label>
                <input type="text" id="username" name="username" placeholder="Username" value="DavideCostantini"/>
            </p>
            <p>
                <label for="password">Password: </label>
                <input type="password" id="password" name="password" placeholder="Password" value="iot856114"/>
            </p>
            <br>
            <button id="login_button" type="button">Login</button>
        </div>
        <div id="main_container" hidden>
            <h1>Rooms</h1>
            <div class="room-list">
                <span class="room">1</span>
                <span class="room">2</span>
                <span class="room">3</span>
                <span class="room">4</span>
                <span class="room">5</span>
                <span class="room">6</span>
                <span class="room">7</span>
                <span class="room">8</span>
                <span class="room">9</span>
            </div>
            <h1>Last readings:</h1>
            <p>Status: <span id="status">not connected</span></p>
            <p>Power saving mode: <span id="power_saving_mode">none</span></p>
            <p>Room: #<span id="room_number">-1</span></p>
            <p class="text-with-image">
                <img class="warning" id="temperature_warning" src="/images/warning_50dp.png" hidden/>
                Temperature: <span id="last_temperature">--</span>&deg;C
            </p>
            <p>Humidity: <span id="last_humidity">--</span>%</p>
            <p class="text-with-image">
                <img class="warning" id="signal_strength_warning" src="/images/warning_50dp.png" hidden/>
                WiFi signal strength: <span id="last_signal_strength">--</span> dBm
            </p>
            <br>
            <button id="resume_button" style="display: none">Resume</button>
            <button id="pause_button">Pause</button>
            <button id="away_button">Away</button>
            <br>
            <h1>Update room ID:</h1>
            <p>
                <label for="new_room_number">Room: #</label>
                <input type="number" id="new_room_number" name="new_room_number" step="1" min="1" value="roomNumber"/>
            </p>
            <br>
            <button id="update_room" type="button">Update</button>
            <br>
            <h1>Configure thresholds:</h1>
            <p>
                <label for="low_temperature">Low temperature: </label>
                <input type="number" id="low_temperature" name="low_temperature" step="0.01" value="lowTemperatureThreshold"/>
            </p>
            <p>
                <label for="high_temperature">High temperature: </label>
                <input type="number" id="high_temperature" name="high_temperature" step="0.01" value="highTemperatureThreshold"/>
            </p>
            <p>
                <label for="signal_strength">Signal stength: </label>
                <input type="number" id="signal_strength" name="signal_strength" step="1" value="signalStrengthThreshold"/>
            </p>
            <br>
            <button id="update_thresholds">Set</button>
            <br>
            <h1>Night mode</h1>
            <div id="night_mode_not_set">
                <p style="color: #e81a1a">Night mode not configured</p>
                <br>
            </div>
            <p>
                Start: <input type="number" id="night_mode_start_hour" min="0" max="23" step="1" value="0"/>:<input type="number" id="night_mode_start_minute" min="0" max="59" step="1" value="0"/>
            </p>
            <p>
                End: <input type="number" id="night_mode_end_hour" min="0" max="23" step="1" value="0"/>:<input type="number" id="night_mode_end_minute" min="0" max="59" step="1" value="0"/>
            </p>
            <br>
            <button id="update_night_mode">Set</button>
        </div>
        <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
        <script src="/javascripts/mqttClient.js"></script>
        <script src="/javascripts/index.js"></script>
    </body>
</html>
